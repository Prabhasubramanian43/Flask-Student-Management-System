<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Index</title>
    <link rel="stylesheet" href="{{url_for('static',filename='bt/bootstrap.min.css')}}">
    <link rel="stylesheet" href="{{url_for('static',filename='font/all.min.css')}}">
    <script src="{{url_for('static',filename='js/jquery-3.7.1.min.js')}}"></script>
    <style>
        body{
            background-image: url("{{ url_for('static', filename='images/oynO57.jpg')}}");
            background-size: cover;
            background-repeat: no-repeat;
            background-attachment: fixed;
            background-position: center;
            }
        .scl{
            color:#ffff;
            margin-top:140px;
            margin-left:10px;
           }
        .cls{
          color:#000;
          text-align:center;
          border: 1px solid #333;
          box-shadow: 0 0 1px #333;
          background-color: #ffffff;
        }
    </style>
</head>
<body>
<div class="container-fluid">
        <h1 class="cls"> Python Flask CURD Application</h1>
        <h1 class="scl">STUDENT MANAGEMENT SYSTEM</h1><br>
     {% with messages = get_flashed_messages(with_categories=True) %}
              {% if messages %}
                    {% for category, message in messages %}
                        <div class="alert  alert-{{ category }}">{{ message }}</div>
                    {% endfor %}
             {% endif %}
            {% endwith %}
            <div class="col-md-offset col-md-5">
                <table class="table table-bordered text-center" >
                <tr>
                    <td>
                        <a href="{{ url_for('add_record') }}" class="btn btn-primary btn-lg text-align:center;">
                            <i class="fas fa-plus"></i> Add Record
                        </a>
                    </td>
                </tr>
                    <tr>
                    <td>
                        <a href="{{ url_for('view_record') }}" class="btn btn-info btn-lg">
                            <i class="fas fa-plus"></i> View Record
                        </a>
                    </td>
                </tr>
            </table>
            </div>
</div>
</body>
</html>
<script>
    $(document).ready(function(){
       $(".alert").hide(2000)
    });
</script>
