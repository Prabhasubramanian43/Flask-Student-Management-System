<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Add_Record</title>
    <link rel="stylesheet" href="{{url_for('static',filename='bt/bootstrap.min.css')}}">
    <link rel="stylesheet" href="{{url_for('static',filename='font/all.min.css')}}">
    <script src="{{url_for('static',filename='js/jquery-3.7.1.min.js')}}"></script>
    <style>
       body{
            background-image: url("{{ url_for('static', filename='images/sch.jpg')}}");
            background-size: cover;
            background-repeat: no-repeat;
            background-attachment: fixed;
            background-position: center;
            }

         </style>
</head>
<body>
    <div class="container">
        <div class="offset-3 col-md-5">
            <form method="post" >
                <h2 class="page-header text-info text-center">New Student</h2>
                <div class="form-group">
                    <label>Name</label>
                    <input type="text" class="form-control" name="name" required>
                </div>
                <div class="form-group">
                    <label>Age</label>
                    <input type="number" class="form-control" name="age" required>
                </div>
                <div class="form-group">
                    <label>Course</label>
                    <input type="text" class="form-control" name="course" required>
                </div>

                 <div class="form-group">
                    <label>Contact</label>
                    <input type="text" class="form-control" name="contact" required>
                </div>
                 <div class="form-group">
                    <label>Mail</label>
                    <input type="text" class="form-control" name="mail" required>
                 <div class="form-group">
                    <label>Address</label>
                    <textarea class="form-control" name="address" required></textarea>
                </div>
                </div><br>
                 <div class="form-group">
                     <input type="submit" class=" btn btn-success btn-block" value="save" >
                       <a href="{{ url_for('home') }}" class="btn btn-secondary px-4 ms-2">Cancel</a>
                </div>
            </form>
        </div>
    </div>
</body>
</html>
