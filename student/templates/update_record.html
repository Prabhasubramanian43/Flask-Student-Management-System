<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Update_Record</title>
     <link rel="stylesheet" href="{{url_for('static',filename='bt/bootstrap.min.css')}}">
    <link rel="stylesheet" href="{{url_for('static',filename='font/all.min.css')}}">
    <script src="{{url_for('static',filename='js/jquery-3.7.1.min.js')}}"></script>
      <style>
     body{
            background-image: url("{{ url_for('static', filename='images/scho.jpg')}}");
            background-size: cover;
            background-repeat: no-repeat;
            background-attachment: fixed;
            background-position: center;
            }
          div{
           color:white;
          }
          label {
            color:black;
          }
         </style>
</head>
<body>
 <div class="container">
        <div class="offset-3 col-md-5">
            <form method="post" action=""   autocomplete="off">
                <h2 class="page-header text-danger text-center">update_record</h2>

                <div class="form-group mb-3">
                    <label>Name</label>
                    <input type="text" class="form-control" name="name" value="{{data['name']}}">
                </div>
                <div class="form-group mb-3">
                    <label>Age</label>
                    <input type="number" class="form-control" name="age" value="{{data['age']}}">
                </div>
                <div class="form-group mb-3">
                    <label>Course</label>
                    <input type="text" class="form-control" name="course" value="{{data['course']}}">
                </div>
                 <div class="form-group mb-3">
                    <label>Contact</label>
                    <input type="text" class="form-control" name="contact" value="{{data['contact']}}">
                </div>
                 <div class="form-group mb-3">
                    <label>Mail</label>
                    <input type="text" class="form-control" name="mail" value="{{data['mail']}}">
                </div>
                 <div class="form-group mb-3">
                    <label>Address</label>
                    <textarea class="form-control" name="address" >{{data['address']}}</textarea>
                </div>
                <br>
                 <div class="form-group text-center">
                     <input type="submit" class=" btn btn-success btn-block" value="Update" >
                       <a href="{{ url_for('home') }}" class="btn btn-secondary px-4 ms-2">Cancel</a>
                </div>
            </form>
        </div>
    </div>
</body>
</html>
